# Feed list. Seven enabled feeds returned usable items on 2026-10-31.
# Politico returned HTTP 403; it stays enabled so another runner can retry it.
# Run `python scripts/fetch_feeds.py --check` to check current health.
#
# Status key:
#   confirmed   - returned usable feed items at the last live check
#   check       - needs investigation or verification on another runner
#   disabled    - no working feed found; enable only after adding a verified URL
feeds:
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    enabled: true
    status: confirmed

  - name: NPR
    url: https://feeds.npr.org/1001/rss.xml
    enabled: true
    status: confirmed

  - name: The Guardian
    url: https://www.theguardian.com/world/rss
    enabled: true
    status: confirmed

  - name: Al Jazeera
    url: https://www.aljazeera.com/xml/rss/all.xml
    enabled: true
    status: confirmed

  - name: Foreign Policy
    url: https://foreignpolicy.com/feed/
    enabled: true
    status: confirmed

  - name: Politico
    url: https://www.politico.com/rss/politicopicks.xml
    enabled: true
    status: check

  - name: SCOTUSblog
    url: https://www.scotusblog.com/feed/
    enabled: true
    status: confirmed

  - name: The Conversation
    url: https://theconversation.com/us/politics/articles.atom
    enabled: true
    status: confirmed

  - name: Lawfare
    # No confirmed feed. Lawfare's site returned no RSS, and only its podcast
    # feeds are listed. Add a verified URL here, then set enabled: true.
    url: https://www.lawfaremedia.org/feed
    enabled: false
    status: disabled

  - name: Brookings
    # No confirmed feed. Brookings links to an RSS subscribe page, but the
    # URL wasn't found. Add a verified URL here, then set enabled: true.
    url: https://www.brookings.edu/feed/
    enabled: false
    status: disabled
