# Global settings. Times are shown and scheduled in this timezone.
site_title: "News Digest"
timezone: America/Chicago
archive_days: 90
user_agent: "news-digest/1.0 (+https://github.com/Dillonbrouwer/news-digest)"  # replace OWNER
request_timeout_seconds: 20
stale_feed_hours: 48

# Teams digest
digest_local_hour: 7          # 7:00 AM Central
digest_items_per_topic: 5
post_on_quiet_days: false     # if true, post a one-line note when nothing is new
