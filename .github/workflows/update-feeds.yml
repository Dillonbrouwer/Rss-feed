name: Update feeds and page

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: update-feeds-and-page
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch feeds
        id: fetch
        # Publish the health report even when every feed is temporarily down.
        continue-on-error: true
        run: python scripts/fetch_feeds.py
      - run: python scripts/render_page.py
      - name: Save archive and generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh news archive and page'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - name: Deploy page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report total feed failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo '::error::Feed collection failed. See Fetch feeds and the published health report.'
          exit 1
