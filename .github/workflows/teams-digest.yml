name: Teams daily digest

on:
  schedule:
    # 07:00 America/Chicago falls at one of these UTC hours, depending on DST.
    - cron: '0 12,13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Post now, including on quiet days
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: teams-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - name: Check optional Teams configuration
        id: webhook
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo '::warning::TEAMS_WEBHOOK_URL is not set; skipping the optional Teams digest.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.webhook.outputs.configured == 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.webhook.outputs.configured == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.webhook.outputs.configured == 'true'
        run: python -m pip install -r requirements.txt
      - name: Refresh articles before posting
        if: steps.webhook.outputs.configured == 'true'
        run: python scripts/fetch_feeds.py
      - name: Post digest
        if: steps.webhook.outputs.configured == 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          python scripts/send_teams_digest.py "${args[@]}"
